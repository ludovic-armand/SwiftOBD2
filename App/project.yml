name: SwiftOBD2Dash
options:
  bundleIdPrefix: com.ludovic.swiftobd2dash
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""        # leave blank → Xcode prompts you to pick "Personal Team"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    # Free Apple ID signing only allows up to 3 apps per cert and 7-day cert lifetime.
    # See README for renewal workflow.

# Reference the SwiftOBD2 package that lives one directory up.
packages:
  SwiftOBD2:
    path: ".."

targets:
  SwiftOBD2Dash:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SwiftOBD2Dash
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
    info:
      path: SwiftOBD2Dash/Info.plist
      properties:
        CFBundleDisplayName: "OBD Dash"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: "LaunchBackground"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
        NSBluetoothAlwaysUsageDescription: "Used to talk to your OBD-II adapter and read live data from your car."
        NSBluetoothPeripheralUsageDescription: "Used to talk to your OBD-II adapter and read live data from your car."
        NSLocationWhenInUseUsageDescription: "Used to log your trips and (later) show your position on the map."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Used to keep recording your trip while the screen is off."
        UIRequiredDeviceCapabilities:
          - arm64
          - bluetooth-le
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.ludovic.swiftobd2dash"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"
    dependencies:
      - package: SwiftOBD2
        product: SwiftOBD2
